# Six producers compute and two fetch.
#
# Every one takes its keys with `keyArg` rather than `keyArgs`: a birth key carries pipes, a comma
# and the slash in `Europe/London`, and `keyArgs` would make those path segments. realm-chess has
# the same constraint for the same reason — a FEN has slashes and spaces in it.
#
# The computing producers cache `immutable`. That is not a guess about volatility: a chart is a
# deterministic function of an instant and a place, so the answer for a key is the same answer
# forever, and the cache is pure saving. There is nothing to invalidate.

# ── Computed in the realm's own bundle: no network, no key, no rate limit ──────────────────────

- name: natalChart
  kind: remote
  operation: natalChart
  keyArg: specs
  records: "$[*]"
  # Filters nothing. One chart cast produces every body, every cusp and every aspect at once, so
  # there is no narrower fetch to ask for; the graph does the filtering, correctly.
  pushdown: []
  cache: { kind: immutable }

